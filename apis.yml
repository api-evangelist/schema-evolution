- name: AWS Glue Schema Registry API
  description: >-
    AWS Glue Schema Registry is a feature that enables you to centrally discover, control, and evolve
    data stream schemas. The AWS Glue Schema Registry API supports creating, deleting, listing, updating,
    and fetching schemas, and it supports compatibility checking for Avro and JSON Schema formats.
  humanURL: https://docs.aws.amazon.com/glue/latest/dg/schema-registry.html
