image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/icons/schema-evolution.png
name: Schema Evolution
description: >-
  Schema Evolution is the practice of managing changes to data schemas over time while preserving compatibility between
  producers and consumers. It covers backward compatibility, forward compatibility, full compatibility, breaking change
  detection, schema migration strategies, and versioning patterns for REST APIs, event streaming (Kafka/Avro), GraphQL,
  database schemas, and Protocol Buffers. Effective schema evolution is critical for maintaining API contracts and
  enabling independent deployment of distributed system components.
url: https://github.com/api-evangelist/schema-evolution
kind: topic
tags:
- Schema Evolution
- Backward Compatibility
- Forward Compatibility
- API Versioning
- Breaking Changes
- Schema Registry
- Data Migration
- Kafka
